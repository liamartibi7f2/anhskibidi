    <!-- Nơi gắn toàn bộ giao diện CashFlow -->

  <!-- 1. Thư viện Chart.js, SheetJS (XLSX) & Firebase Compat SDK -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- 2. Khởi tạo Firebase + HubDB (Đồng bộ Firestore & LocalStorage) -->
  <script>
    (function () {
      'use strict';

      // ====================================================================
      // CẤU HÌNH FIREBASE CỦA BẠN (ĐÃ SỬA CHUẨN):
      // ====================================================================
      var firebaseConfig = {
        apiKey: "AIzaSyA-OzyenFKXldv5p5WxFAIJ6dM4ZVucrGU",
        authDomain: "financial-performaces.firebaseapp.com",
        projectId: "financial-performaces",
        storageBucket: "financial-performaces.firebasestorage.app",
        messagingSenderId: "383668604427",
        appId: "1:383668604427:web:b20664ddd1d8f63522c10e",
        measurementId: "G-MC56TNVCZ3"
      };

      var isFirebaseConfigured = Boolean(firebaseConfig.apiKey && firebaseConfig.apiKey !== "THAY_API_KEY_CUA_BAN");
      var auth = null;
      var db = null;
      var currentUser = null;

      // Promise chờ Firebase xác nhận trạng thái đăng nhập lần đầu trước khi nạp dữ liệu
      var authReadyResolve;
      var authReadyPromise = new Promise(function (resolve) {
        authReadyResolve = resolve;
      });

      if (isFirebaseConfigured && typeof firebase !== 'undefined') {
        try {
          firebase.initializeApp(firebaseConfig);
          auth = firebase.auth();
          db = firebase.firestore();

          var initialAuthChecked = false;
          auth.onAuthStateChanged(function (user) {
            currentUser = user || null;
            updateAuthUI(currentUser);
            if (!currentUser) stopWatchingAccess();
            if (currentUser && db) {
              watchAdminAccess(currentUser);
              // Có phải admin không? (document admins/{uid} do bạn tạo tay trong Console)
              db.collection('admins').doc(currentUser.uid).get().then(function (s) {
                window.__walletIsAdmin = s.exists;
                if (isViewMode && !s.exists) { exitView(); return; }   // không phải admin → thoát chế độ xem
                document.dispatchEvent(new CustomEvent('walletAdminReady'));
              }).catch(function () {
                if (isViewMode) viewError('Không xác minh được quyền admin.');
              });
              // Đăng ký hồ sơ để admin thấy trong danh sách (chỉ ghi vào hồ sơ CỦA MÌNH)
              db.collection('userDirectory').doc(currentUser.uid).set({
                email: currentUser.email || '',
                displayName: currentUser.displayName || '',
                lastLogin: firebase.firestore.FieldValue.serverTimestamp()
              }, { merge: true }).catch(function () {});
            }
            if (!initialAuthChecked) {
              initialAuthChecked = true;
              authReadyResolve(currentUser);
            }
          });
        } catch (err) {
          console.error('[Wallet.OS] Lỗi khởi tạo Firebase:', err);
          authReadyResolve(null);
        }
      } else {
        authReadyResolve(null);
      }

      function updateAuthUI(user) {
        var dot = document.getElementById('st-auth-dot');
        var txt = document.getElementById('st-auth-text');
        if (!dot || !txt) return;
        if (!isFirebaseConfigured) {
          dot.classList.remove('is-online');
          txt.textContent = 'Local Mode (Chưa gắn Firebase)';
          return;
        }
        if (user) {
          dot.classList.add('is-online');
          var name = user.displayName || user.email || 'Cloud';
          txt.textContent = name.split(' ')[0] + ' (Đăng xuất)';
        } else {
          dot.classList.remove('is-online');
          txt.textContent = 'Đăng nhập Cloud';
        }
      }

      // Sự kiện bấm nút Đăng nhập / Đăng xuất
      window.addEventListener('DOMContentLoaded', function () {
        var authBtn = document.getElementById('st-auth');
        if (!authBtn) return;
        updateAuthUI(currentUser);

        authBtn.addEventListener('click', async function () {
          if (!isFirebaseConfigured || !auth) {
            alert('Bạn chưa điền firebaseConfig trong file index.html! Hiện tại dữ liệu đang được lưu trên trình duyệt này.');
            return;
          }
          try {
            if (currentUser) {
              if (confirm('Bạn có muốn đăng xuất khỏi tài khoản ' + (currentUser.email || '') + ' không?')) {
                try { sessionStorage.removeItem('wallet_os_view_uid'); sessionStorage.removeItem('wallet_os_view_label'); } catch (e) {}
                try { await window.WalletAdmin.stopPresence(); } catch (e) {}
                await auth.signOut();
                location.reload();
              }
            } else {
              var provider = new firebase.auth.GoogleAuthProvider();
              await auth.signInWithPopup(provider);
              location.reload();
            }
          } catch (e) {
            console.error('[Wallet.OS] Lỗi đăng nhập:', e);
            alert('Đăng nhập thất bại: ' + (e.message || e));
          }
        });
      });

      // ── A. Bộ chống dội (HubDebounce) ──
      var _timers = {};
      window.HubDebounce = {
        call: function (key, fn, delay) {
          clearTimeout(_timers[key]);
          _timers[key] = setTimeout(fn, delay || 400);
        }
      };

      // ── B. Bộ lưu trữ kép: Cloud Firestore + LocalStorage Cache (HubDB) ──
      var DATA_KEY = 'wallet_os_cashflow_data_v1';
      var META_KEY = 'wallet_os_cashflow_meta_v1';

      var DEFAULT_DATA = {
        startingBalance: 0,
        balanceSnapshots: [],
        transactions: [],
        debts: [],
        goals: []
      };

      var DEFAULT_META = {
        netWorthOffset: 0,
        savingsBalance: 0,
        initBank: 0,
        initCash: 0,
        budgets: {},
        budgetPlans: {},
        dailyLimits: {}
      };

      function readLocal(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return JSON.parse(JSON.stringify(fallback));
      }

      function writeLocal(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      }

      // ── B2. CHẾ ĐỘ ADMIN XEM (CHỈ ĐỌC) ──
      // Lưu trong sessionStorage: đóng tab là tự quay về tài khoản của chính mình.
      var VIEW_KEY = 'wallet_os_view_uid';
      var VIEW_LABEL_KEY = 'wallet_os_view_label';
      var viewUid = null, viewLabel = '';
      try {
        viewUid = sessionStorage.getItem(VIEW_KEY) || null;
        viewLabel = sessionStorage.getItem(VIEW_LABEL_KEY) || '';
      } catch (e) {}
      var isViewMode = Boolean(viewUid);
      var viewErrorMsg = '';
      var viewNote = '';
      var viewLogged = false;
      if (isViewMode) document.body.classList.add('wallet-readonly');

      function cloneJSON(o) { return JSON.parse(JSON.stringify(o)); }

      function exitView() {
        try { sessionStorage.removeItem(VIEW_KEY); sessionStorage.removeItem(VIEW_LABEL_KEY); } catch (e) {}
        var went = false;
        function go() { if (went) return; went = true; location.reload(); }
        stopPresence().then(go, go);   // báo "admin đã rời" cho người dùng trước khi tải lại
        setTimeout(go, 1200);
      }

      function viewError(msg) {
        viewErrorMsg = msg;
        document.dispatchEvent(new CustomEvent('walletViewError', { detail: msg }));
      }

      // Đọc 1 document của người được xem — KHÔNG đụng localStorage, KHÔNG ghi gì lên Cloud
      async function loadViewDoc(docId, fallback) {
        await authReadyPromise;
        if (!currentUser || !db) { viewError('Cần đăng nhập tài khoản admin để xem.'); return null; }
        try {
          var snap = await db.collection('users').doc(viewUid).collection('cashflow').doc(docId).get();
          if (!snap.exists && docId === 'data') {
            viewNote = 'Chưa có dữ liệu thu chi cho tài khoản/UID này (UID sai hoặc người dùng chưa lưu gì).';
            document.dispatchEvent(new CustomEvent('walletViewNote', { detail: viewNote }));
          }
          return Object.assign(cloneJSON(fallback), snap.exists ? snap.data() : {});
        } catch (e) {
          console.error('[Wallet.OS][view] Lỗi đọc dữ liệu:', e);
          viewError('Không đọc được dữ liệu (' + (e.code || e.message) + ').');
          return null;
        }
      }

      function logViewStart() {
        if (viewLogged || !db || !currentUser) return;
        viewLogged = true;
        db.collection('auditLogs').add({
          adminUid: currentUser.uid,
          adminEmail: currentUser.email || '',
          targetUid: viewUid,
          targetLabel: viewLabel,
          action: 'view',
          at: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function (e) { console.warn('[Wallet.OS] Không ghi được nhật ký xem:', e); });
        startPresence();
      }

      // ── B3. THÔNG BÁO TRUY CẬP CỦA ADMIN ──
      // Tài liệu: users/{uid}/adminAccess/status
      //   Admin ghi : adminUid, active, startedAt, heartbeat   (mỗi 30s khi đang xem)
      //   Người dùng: chỉ đọc + tự ghi seenAt (đánh dấu đã thấy thông báo)
      var BEAT_MS = 30000;      // chu kỳ heartbeat của admin
      var STALE_MS = 75000;     // quá ngưỡng này không có nhịp mới = coi như admin đã rời
      var presenceTimer = null, presenceUid = null;

      function accessRef(uid) {
        return db.collection('users').doc(uid).collection('adminAccess').doc('status');
      }
      function srvNow() { return firebase.firestore.FieldValue.serverTimestamp(); }

      function beat() {
        if (!presenceUid || document.visibilityState === 'hidden') return;
        accessRef(presenceUid).set({ active: true, heartbeat: srvNow() }, { merge: true }).catch(function () {});
      }
      function startPresence() {
        if (presenceTimer || !isViewMode || !db || !currentUser || !viewUid || viewUid === currentUser.uid) return;
        presenceUid = viewUid;
        accessRef(presenceUid).set({
          adminUid: currentUser.uid, active: true, startedAt: srvNow(), heartbeat: srvNow()
        }, { merge: true }).catch(function (e) { console.warn('[Wallet.OS] Không ghi được trạng thái xem:', e); });
        presenceTimer = setInterval(beat, BEAT_MS);
        document.addEventListener('visibilitychange', beat);
        window.addEventListener('pagehide', function () { stopPresence(); });
      }
      function stopPresence() {
        if (!presenceTimer || !presenceUid) return Promise.resolve();
        clearInterval(presenceTimer); presenceTimer = null;
        var uid = presenceUid; presenceUid = null;
        document.removeEventListener('visibilitychange', beat);
        return accessRef(uid).set({ active: false, heartbeat: srvNow() }, { merge: true }).catch(function () {});
      }

      // Phía người dùng: lắng nghe realtime xem admin có đang xem / đã xem chưa
      var accessState = { notice: null, live: false };
      var accessListeners = [];
      var accessUnsub = null, accessTick = null;
      function emitAccess(type, detail) {
        if (type === 'notice') accessState.notice = detail;
        if (type === 'live') accessState.live = !!detail;
        accessListeners.forEach(function (fn) { try { fn(type, detail); } catch (e) {} });
      }
      function stopWatchingAccess() {
        if (accessUnsub) { accessUnsub(); accessUnsub = null; }
        if (accessTick) { clearInterval(accessTick); accessTick = null; }
      }
      function watchAdminAccess(user) {
        if (isViewMode || !db || !user || accessUnsub) return;   // admin đang xem người khác thì không nhận thông báo
        var ref = accessRef(user.uid);
        var first = true, lastBeat = 0, lastBeatLocal = 0, adminActive = false, isLive = false;

        function markSeen() { ref.update({ seenAt: srvNow() }).catch(function () {}); }
        function evalLive() {
          var live = adminActive && lastBeatLocal > 0 && (Date.now() - lastBeatLocal) < STALE_MS;
          if (live === isLive) return;
          isLive = live;
          emitAccess('live', live);
          markSeen();   // đã thấy trực tiếp / đã rời → không hiện lại "x giờ trước" cho lần này
        }

        accessUnsub = ref.onSnapshot(function (snap) {
          if (!snap.exists) { adminActive = false; evalLive(); return; }
          var d = snap.data({ serverTimestamps: 'estimate' }) || {};
          var hb = d.heartbeat ? d.heartbeat.toMillis() : 0;
          var seen = d.seenAt ? d.seenAt.toMillis() : 0;
          adminActive = d.active === true;
          // Dùng giờ nhận trên máy người dùng để không phụ thuộc lệch đồng hồ giữa 2 máy
          if (hb && hb !== lastBeat) {
            if (!first || (Date.now() - hb) < STALE_MS) lastBeatLocal = Date.now();
            lastBeat = hb;
          }
          evalLive();
          if (first) {
            first = false;
            // Mới đăng nhập/mở web: admin không còn xem mà có lượt chưa báo → hiện "đã xem lúc ..."
            if (!isLive && hb && hb > seen) { emitAccess('notice', { at: hb }); markSeen(); }
          }
        }, function (err) { console.warn('[Wallet.OS] Không nghe được trạng thái admin:', err && err.code); });
        accessTick = setInterval(evalLive, 15000);
      }

      window.WalletAdmin = {
        isViewMode: isViewMode,
        viewUid: viewUid,
        viewLabel: viewLabel,
        isAdmin: function () { return !!window.__walletIsAdmin; },
        getError: function () { return viewErrorMsg; },
        getNote: function () { return viewNote; },
        listUsers: async function () {
          var snap = await db.collection('userDirectory').orderBy('lastLogin', 'desc').limit(200).get();
          return snap.docs.map(function (d) { var v = d.data(); v.uid = d.id; return v; })
            .filter(function (u) { return !currentUser || u.uid !== currentUser.uid; });
        },
        stopPresence: stopPresence,
        subscribeAccess: function (fn) {
          accessListeners.push(fn);
          if (accessState.live) fn('live', true);
          if (accessState.notice) fn('notice', accessState.notice);
        },
        enter: function (uid, label) {
          try { sessionStorage.setItem(VIEW_KEY, uid); sessionStorage.setItem(VIEW_LABEL_KEY, label || ''); } catch (e) {}
          location.reload();
        },
        exit: exitView
      };

      window.HubDB = {
        loadCashFlowData: async function () {
          if (isViewMode) {
            var vd = await loadViewDoc('data', DEFAULT_DATA);
            if (vd) logViewStart();
            return vd;   // null → cashflow.js vào "offline mode", không tự lưu gì
          }
          await authReadyPromise;
          if (currentUser && db) {
            try {
              var docRef = db.collection('users').doc(currentUser.uid).collection('cashflow').doc('data');
              var snap = await docRef.get();
              if (snap.exists && snap.data()) {
                var cloudData = Object.assign({}, DEFAULT_DATA, snap.data());
                writeLocal(DATA_KEY, cloudData);
                if (Array.isArray(cloudData.goals)) {
                  writeLocal('hub_cf_goals_backup_v1', cloudData.goals);
                }
                return cloudData;
              } else {
                // Nếu lần đầu đăng nhập mà dưới máy đã có dữ liệu tạm -> đẩy lên Cloud luôn
                var localData = readLocal(DATA_KEY, DEFAULT_DATA);
                await docRef.set(localData);
                return localData;
              }
            } catch (e) {
              console.warn('[Wallet.OS] Không đọc được Cloud, dùng bản lưu cục bộ:', e);
            }
          }
          return readLocal(DATA_KEY, DEFAULT_DATA);
        },

        saveCashFlowData: async function (data) {
          if (isViewMode) return;   // CHỈ ĐỌC: không ghi cục bộ, không ghi Cloud
          writeLocal(DATA_KEY, data);
          await authReadyPromise;
          if (currentUser && db) {
            try {
              var cleanData = JSON.parse(JSON.stringify(data));
              await db.collection('users').doc(currentUser.uid).collection('cashflow').doc('data').set(cleanData);
            } catch (e) {
              console.error('[Wallet.OS] Lỗi lưu dữ liệu lên Cloud:', e);
            }
          }
        },

        loadCashFlowMeta: async function () {
          if (isViewMode) return (await loadViewDoc('meta', DEFAULT_META)) || cloneJSON(DEFAULT_META);
          await authReadyPromise;
          if (currentUser && db) {
            try {
              var docRef = db.collection('users').doc(currentUser.uid).collection('cashflow').doc('meta');
              var snap = await docRef.get();
              if (snap.exists && snap.data()) {
                var cloudMeta = Object.assign({}, DEFAULT_META, snap.data());
                writeLocal(META_KEY, cloudMeta);
                return cloudMeta;
              } else {
                var localMeta = readLocal(META_KEY, DEFAULT_META);
                await docRef.set(localMeta);
                return localMeta;
              }
            } catch (e) {
              console.warn('[Wallet.OS] Không đọc được Meta trên Cloud, dùng bản cục bộ:', e);
            }
          }
          return readLocal(META_KEY, DEFAULT_META);
        },

        saveCashFlowMeta: async function (meta) {
          if (isViewMode) return;   // CHỈ ĐỌC
          writeLocal(META_KEY, meta);
          await authReadyPromise;
          if (currentUser && db) {
            try {
              var cleanMeta = JSON.parse(JSON.stringify(meta));
              await db.collection('users').doc(currentUser.uid).collection('cashflow').doc('meta').set(cleanMeta);
            } catch (e) {
              console.error('[Wallet.OS] Lỗi lưu Meta lên Cloud:', e);
            }
          }
        },

        subscribeCashFlow: function (cb) {
          if (typeof cb !== 'function') return function () {};
          var unsubData = null, unsubMeta = null, dead = false;
          authReadyPromise.then(function () {
            if (dead || !currentUser || !db) return;
            var uid = isViewMode ? viewUid : currentUser.uid;
            if (!uid) return;
            var base = db.collection('users').doc(uid).collection('cashflow');
            unsubData = base.doc('data').onSnapshot(function (snap) {
              if (!isViewMode && snap.metadata && snap.metadata.hasPendingWrites) return;
              if (snap.exists && snap.data()) {
                var cloudData = Object.assign({}, cloneJSON(DEFAULT_DATA), snap.data());
                if (!isViewMode) {
                  writeLocal(DATA_KEY, cloudData);
                  if (Array.isArray(cloudData.goals)) writeLocal('hub_cf_goals_backup_v1', cloudData.goals);
                }
                try { cb({ type: 'data', uid: uid, data: cloudData }); } catch (e) { console.error(e); }
              }
            }, function (e) { console.warn('[Wallet.OS] Mất kết nối đồng bộ thu chi (data):', e); });
            unsubMeta = base.doc('meta').onSnapshot(function (snap) {
              if (!isViewMode && snap.metadata && snap.metadata.hasPendingWrites) return;
              if (snap.exists && snap.data()) {
                var cloudMeta = Object.assign({}, cloneJSON(DEFAULT_META), snap.data());
                if (!isViewMode) writeLocal(META_KEY, cloudMeta);
                try { cb({ type: 'meta', uid: uid, meta: cloudMeta }); } catch (e) { console.error(e); }
              }
            }, function (e) { console.warn('[Wallet.OS] Mất kết nối đồng bộ thu chi (meta):', e); });
          });
          return function () {
            dead = true;
            if (unsubData) { try { unsubData(); } catch (e) {} unsubData = null; }
            if (unsubMeta) { try { unsubMeta(); } catch (e) {} unsubMeta = null; }
          };
        }
      };

      // ── C0. ĐỒNG BỘ CLOUD CHO MODULE THỜI GIAN (mỗi tài khoản một document) ──
      // Cloud : users/{uid}/timeManagement/state  → { schema, json, updatedAt }
      // Local : hub_tm_data:{uid}  (bản nháp theo tài khoản)  ·  hub_tm_data:guest (khi chưa đăng nhập)
      // Gộp theo từng mục (updatedAt) + "bia mộ" khi xoá → 2 thiết bị không ghi đè nhau.
      (function () {
        var TM_LOCAL = 'hub_tm_data';
        var TM_CLAIM_OFF = 'hub_tm_claim_off:';
        var TOMB_TTL = 90 * 86400000;      // bia mộ cũ hơn 90 ngày được dọn để doc không phình
        var MAX_BYTES = 900 * 1024;        // Firestore giới hạn 1 MiB / document
        var KINDS = [['timeBlocks', 'blocks'], ['customTags', 'tags'], ['templates', 'templates']];
        var authListeners = [];

        function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
        function lsKey(uid) { return TM_LOCAL + ':' + (uid || 'guest'); }
        function lsRead(k) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
        function lsWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
        function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
        function tmRef(uid) { return db.collection('users').doc(uid).collection('timeManagement').doc('state'); }
        function parseDoc(snap) {
          if (!snap || !snap.exists) return null;
          try { var d = snap.data(); return d && d.json ? JSON.parse(d.json) : null; } catch (e) { return null; }
        }
        function tombsOf(p, kind) { return (p && p.tombs && p.tombs[kind] && typeof p.tombs[kind] === 'object') ? p.tombs[kind] : {}; }
        function ts(x) { return Number(x && x.updatedAt) || 0; }
        function pick(x, y) {                       // mục nào mới hơn thắng; hoà thì chọn theo nội dung → 2 máy luôn hội tụ
          if (!y) return x;
          if (ts(x) !== ts(y)) return ts(x) > ts(y) ? x : y;
          return JSON.stringify(x) >= JSON.stringify(y) ? x : y;
        }

        /** Gộp 2 bản dữ liệu (thuần, đối xứng). Thứ tự giữ theo bản `a`, mục mới của `b` nối sau. */
        function merge(a, b) {
          if (!a) return b ? clone(b) : null;
          if (!b) return clone(a);
          var out = { v: 2 }, tombs = { blocks: {}, tags: {}, templates: {} };
          KINDS.forEach(function (k) {
            var ta = tombsOf(a, k[1]), tb = tombsOf(b, k[1]), t = tombs[k[1]];
            Object.keys(ta).forEach(function (id) { t[id] = Number(ta[id]) || 0; });
            Object.keys(tb).forEach(function (id) { t[id] = Math.max(t[id] || 0, Number(tb[id]) || 0); });
          });
          KINDS.forEach(function (k) {
            var la = Array.isArray(a[k[0]]) ? a[k[0]] : null, lb = Array.isArray(b[k[0]]) ? b[k[0]] : null;
            if (!la && !lb) return;                 // để trống → module tự gieo mẫu mặc định
            la = la || []; lb = lb || [];
            var byB = {}, used = {}, res = [];
            lb.forEach(function (it) { if (it && it.id != null) byB[it.id] = it; });
            la.forEach(function (it) { if (it && it.id != null) { used[it.id] = 1; res.push(pick(it, byB[it.id])); } });
            lb.forEach(function (it) { if (it && it.id != null && !used[it.id]) res.push(it); });
            out[k[0]] = clone(res.filter(function (it) { var t = tombs[k[1]][it.id]; return !(t && t >= ts(it)); }));
          });
          var sa = Number(a.settingsAt) || 0, sb = Number(b.settingsAt) || 0;
          var s = sb > sa ? b : sa > sb ? a : (JSON.stringify([a.audio, a.activeTagId]) >= JSON.stringify([b.audio, b.activeTagId]) ? a : b);
          out.audio = clone(s.audio); out.activeTagId = s.activeTagId; out.settingsAt = Math.max(sa, sb);
          out.tombs = tombs; out.updatedAt = Math.max(Number(a.updatedAt) || 0, Number(b.updatedAt) || 0);
          return out;
        }
        function fingerprint(p) {                   // so sánh không phụ thuộc thứ tự
          if (!p) return '';
          return JSON.stringify([KINDS.map(function (k) {
            return (Array.isArray(p[k[0]]) ? p[k[0]] : []).map(function (it) { return it.id + ':' + ts(it); }).sort();
          }), Number(p.settingsAt) || 0, KINDS.map(function (k) { return Object.keys(tombsOf(p, k[1])).sort(); })]);
        }
        function pruneTombs(p) {
          var now = Date.now();
          KINDS.forEach(function (k) {
            var t = p.tombs && p.tombs[k[1]];
            if (t) Object.keys(t).forEach(function (id) { if (now - (Number(t[id]) || 0) > TOMB_TTL) delete t[id]; });
          });
          return p;
        }
        function bytes(s) { return typeof TextEncoder !== 'undefined' ? new TextEncoder().encode(s).length : s.length * 2; }
        function syncError(code) { document.dispatchEvent(new CustomEvent('walletTimeSyncError', { detail: code })); }

        Object.assign(window.HubDB, {
          mergeTimeManagement: merge,

          getAuthStatus: function () { return { uid: currentUser ? currentUser.uid : null, email: currentUser ? currentUser.email || '' : '' }; },

          onAuthChange: function (cb) { if (typeof cb === 'function') authListeners.push(cb); },

          /** → { uid, payload, claimable?, dirty?, readonly? } cho tài khoản đang đăng nhập (hoặc đang xem ở chế độ admin chỉ đọc) */
          loadTimeManagementState: async function () {
            if (isViewMode) {
              await authReadyPromise;
              if (!currentUser || !db) return { uid: viewUid, payload: null, readonly: true };
              try {
                var snap = await tmRef(viewUid).get();
                return { uid: viewUid, payload: parseDoc(snap), cloudOk: true, readonly: true, dirty: false, claimable: null };
              } catch (e) {
                console.warn('[Wallet.OS] Không đọc được lịch của người dùng đang xem:', e);
                if (e && (e.code === 'permission-denied' || String(e.message || '').toLowerCase().indexOf('permission') !== -1)) {
                  syncError('tm/view-denied');
                }
                return { uid: viewUid, payload: null, readonly: true };
              }
            }
            await authReadyPromise;
            var uid = currentUser ? currentUser.uid : null;
            var guest = lsRead(lsKey(null)), legacy = lsRead(TM_LOCAL);
            if (!uid || !db) return { uid: uid, payload: merge(guest, legacy) };

            var cache = lsRead(lsKey(uid)), remote = null, reachable = true;
            try { remote = parseDoc(await tmRef(uid).get()); }
            catch (e) { reachable = false; console.warn('[Wallet.OS] Không đọc được lịch trên Cloud, dùng bản cục bộ:', e); }

            var payload = merge(cache, remote);
            var dirty = !!payload && (!reachable || !remote || fingerprint(payload) !== fingerprint(remote));
            if (payload) lsWrite(lsKey(uid), payload);

            // Dữ liệu tạo khi chưa đăng nhập: chỉ ĐỀ NGHỊ nhập, không tự chép vào tài khoản
            var claimable = null, off = false;
            try { off = localStorage.getItem(TM_CLAIM_OFF + uid) === '1'; } catch (e) {}
            var pool = off ? null : merge(guest, legacy);
            if (pool && Array.isArray(pool.timeBlocks)) {
              var have = {}, tomb = tombsOf(payload, 'blocks');
              ((payload && payload.timeBlocks) || []).forEach(function (b) { have[b.id] = 1; });
              var fresh = pool.timeBlocks.filter(function (b) { return b && !have[b.id] && !(tomb[b.id] >= ts(b)); });
              if (fresh.length) claimable = { count: fresh.length, payload: pool };
            }
            return { uid: uid, payload: payload, dirty: dirty, claimable: claimable };
          },

          /** Ghi: luôn lưu cục bộ trước; lên Cloud bằng transaction (đọc → gộp → ghi) */
          saveTimeManagementData: async function (payload, opts) {
            if (isViewMode) return;
            var uid = opts && opts.uid !== undefined ? opts.uid : (currentUser ? currentUser.uid : null);
            var clean = pruneTombs(clone(payload));
            lsWrite(lsKey(uid), clean);
            if (!uid) return;
            await authReadyPromise;
            if (!currentUser || !db || currentUser.uid !== uid) return;   // không bao giờ ghi vào Cloud của tài khoản khác
            try {
              var ref = tmRef(uid);
              var merged = await db.runTransaction(async function (tx) {
                var m = merge(clean, parseDoc(await tx.get(ref)));
                var json = JSON.stringify(m);
                if (bytes(json) > MAX_BYTES) { var err = new Error('Lịch quá lớn'); err.code = 'tm/too-big'; throw err; }
                tx.set(ref, { schema: 'tm2', json: json, updatedAt: m.updatedAt || Date.now() });
                return m;
              });
              lsWrite(lsKey(uid), merged);
            } catch (e) {
              console.error('[Wallet.OS] Lỗi lưu lịch lên Cloud (đã giữ bản cục bộ):', e);
              syncError(e.code || e.message || 'unknown');
            }
          },

          /** cb(uid, remotePayload) mỗi khi thiết bị khác ghi (hoặc chủ tài khoản cập nhật khi admin đang xem); trả về hàm huỷ */
          subscribeTimeManagement: function (cb) {
            if (typeof cb !== 'function') return function () {};
            var unsub = null, dead = false;
            authReadyPromise.then(function () {
              if (dead || !currentUser || !db) return;
              var uid = isViewMode ? viewUid : currentUser.uid;
              if (!uid) return;
              unsub = tmRef(uid).onSnapshot(function (snap) {
                if (!isViewMode && snap.metadata && snap.metadata.hasPendingWrites) return;   // tiếng vọng của chính mình
                var remote = parseDoc(snap);
                if (remote) { try { cb(uid, remote); } catch (e) { console.error(e); } }
              }, function (e) { console.warn('[Wallet.OS] Mất kết nối đồng bộ lịch:', e); });
            });
            return function () { dead = true; if (unsub) unsub(); };
          },

          /** Người dùng đồng ý/từ chối nhập dữ liệu "khách" vào tài khoản */
          claimTimeManagementLocal: function (uid, accept) {
            if (!uid) return;
            if (accept) { lsDel(lsKey(null)); lsDel(TM_LOCAL); }
            else { try { localStorage.setItem(TM_CLAIM_OFF + uid, '1'); } catch (e) {} }
          }
        });

        if (auth) {
          auth.onAuthStateChanged(function (u) {
            var ev = { uid: u ? u.uid : null };
            authListeners.slice().forEach(function (f) { try { f(ev); } catch (e) {} });
          });
        }
      })();

      // ── C. Giả lập đối tượng app ──
      window.app = {
        getLanguage: function () {
          return localStorage.getItem('hub_system_language') || 'vi';
        },
        register: function (mod) {
          // Mỗi module một ô riêng — module Thời gian không được ghi đè Tài chính
          if (mod && mod.id === 'time-management') window.__registeredTime = mod;
          else if (mod && mod.id === 'collab-hub') window.__registeredCollab = mod;
          else window.__registeredCashflow = mod;
        }
      };
    })();
  </script>

        localStorage.setItem('hubos_lang', next);
        syncLangBtn(next);
        window.dispatchEvent(new CustomEvent('hubLanguageChanged', { detail: next }));
      });

      document.getElementById('st-backup').addEventListener('click', async function () {
        var data = await window.HubDB.loadCashFlowData();
        var meta = await window.HubDB.loadCashFlowMeta();
        var payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          data: data,
          meta: meta
        };
        var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'WalletOS_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      var restoreInput = document.getElementById('st-restore-input');
      document.getElementById('st-restore').addEventListener('click', function () {
        restoreInput.click();
      });
      restoreInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = async function (ev) {
          try {
            var parsed = JSON.parse(ev.target.result);
            if (parsed.data) await window.HubDB.saveCashFlowData(parsed.data);
            if (parsed.meta) await window.HubDB.saveCashFlowMeta(parsed.meta);
            if (parsed.data && Array.isArray(parsed.data.goals)) {
              localStorage.setItem('hub_cf_goals_backup_v1', JSON.stringify(parsed.data.goals));
            }
            location.reload();
          } catch (err) {
            alert('File JSON không hợp lệ!');
          }
        };
        reader.readAsText(file);
      });
    });
  </script>

  <!-- 4a'. Streak rail của tab Cộng tác: nghe sự kiện 'collab:status' do collaboration.js phát ra -->
  <script>
    (function () {
      var rail = document.getElementById('st-rail');
      if (!rail) return;
      var brand = document.querySelector('.st-brand--collab');
      var $ = function (id) { return document.getElementById(id); };
      var el = { room: $('st-rail-room'), group: $('st-rail-group'), n: $('st-rail-n'), bar: $('st-rail-bar'), hearts: $('st-rail-hearts'), me: $('st-rail-me'), state: $('st-collab-state') };
      var heartKey = '', lastDetail = null;
      function isEn() {
        try {
          var l = window.app && window.app.getLanguage ? window.app.getLanguage() : localStorage.getItem('hub_system_language');
          return l === 'en';
        } catch (e) { return false; }
      }
      function put(node, t) { if (node && node.textContent !== t) node.textContent = t; }
      function attr(n, k, v) { if (n && n.getAttribute(k) !== v) n.setAttribute(k, v); }
      function hearts(h, max) {
        var en = isEn(), key = h + '/' + max + '/' + (en ? 'en' : 'vi');
        if (key === heartKey) return;
        heartKey = key;
        el.hearts.textContent = '';
        for (var i = 0; i < max; i++) { var s = document.createElement('i'); s.className = i < h ? 'is-full' : 'is-empty'; el.hearts.appendChild(s); }
        el.hearts.setAttribute('role', 'img');
        el.hearts.setAttribute('aria-label', en ? (h + ' of ' + max + ' hearts') : (h + ' trên ' + max + ' tim'));
      }
      function applyStatus(d) {
        lastDetail = d;
        var en = isEn();
        if (!d || d.view !== 'room' || !d.room) {
          attr(rail, 'data-state', 'idle'); attr(rail, 'data-all', '0'); attr(rail, 'data-me', 'none');
          attr(brand, 'data-live', '0'); put(el.state, en ? 'Lobby' : 'Sảnh'); heartKey = '';
          return;
        }
        attr(rail, 'data-state', 'room');
        attr(brand, 'data-live', '1'); put(el.state, en ? 'In room' : 'Trong phòng');
        put(el.room, d.room);
        attr(el.room, 'title', d.room);
        put(el.group, String(d.group));
        put(el.n, d.n + '/' + d.total);
        var pct = d.total ? Math.round(d.n / d.total * 100) : 0;
        if (el.bar.style.width !== pct + '%') el.bar.style.width = pct + '%';
        attr(rail, 'data-all', d.all ? '1' : '0');
        hearts(d.hearts, d.max);
        var me = !d.todayOn ? 'rest' : d.todayDone ? 'done' : 'wait';
        attr(rail, 'data-me', me);
        put(el.me, me === 'rest' ? (en ? '– Rest' : '– Nghỉ') : me === 'done' ? (en ? '✓ Checked in' : '✓ Đã check-in') : (en ? '● Not yet' : '● Chưa check-in'));
      }
      function applyRailLang() {
        var en = isEn();
        put(document.querySelector('#tab-collab span'), en ? 'Collab' : 'Cộng tác');
        put(rail.querySelector('.st-rail-hint .st-rail-k'), en ? 'Tip' : 'Gợi ý');
        put(rail.querySelector('.st-rail-hint .st-rail-v'), en ? 'Join a room to keep streaks together' : 'Vào một phòng để giữ streak cùng nhau');
        put(rail.querySelector('.st-rail-room .st-rail-k'), en ? 'Room' : 'Phòng');
        put(rail.querySelector('.st-rail-group .st-rail-k'), en ? 'Group streak' : 'Chuỗi chung');
        put(rail.querySelector('.st-rail-group .st-rail-u'), en ? 'days' : 'ngày');
        put(rail.querySelector('.st-rail-today .st-rail-k'), en ? 'Today' : 'Hôm nay');
        put(rail.querySelector('.st-rail-me .st-rail-k'), en ? 'You' : 'Bạn');
        applyStatus(lastDetail);
      }
      document.addEventListener('collab:status', function (e) { applyStatus(e.detail); });
      window.addEventListener('hubLanguageChanged', applyRailLang);
      applyRailLang();
    })();
  </script>

  <!-- 4b. Chuyển tab Tài chính / Thời gian (#finance | #time) -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var tabs = document.querySelectorAll('.wos-tab');
      var fin = document.getElementById('cashflow-mount');
      var timeEl = document.getElementById('time-mount');
      var timeMod = window.__registeredTime;
      var collabEl = document.getElementById('collab-mount');
      var collabMod = window.__registeredCollab;
      var current = 'finance';

      // Cảnh báo một lần nếu lịch vượt giới hạn 1 MiB hoặc bị từ chối quyền đọc khi xem hộ
      var warned = false, viewWarned = false;
      document.addEventListener('walletTimeSyncError', function (e) {
        if (e.detail === 'tm/too-big' && !warned) {
          warned = true;
          alert('Lịch đã quá lớn để đồng bộ lên Cloud (dữ liệu vẫn an toàn trên máy này). Hãy xoá bớt khối lịch cũ hoặc ghi chú dài.');
        } else if (e.detail === 'tm/view-denied' && !viewWarned) {
          viewWarned = true;
          alert('Chưa xem được dữ liệu Thời gian của tài khoản này vì Firestore Rules chưa cấp quyền đọc cho Admin. Hãy cập nhật rule: match /users/{uid}/timeManagement/{doc} { allow read: if isOwner(uid) || isAdmin(); } trên Firebase Console.');
        }
      });

      function show(name) {
        if (name === 'time' && !timeMod) name = 'finance';   // module chưa nạp → ở lại Tài chính
        if (name === 'collab' && !collabMod) name = 'finance';
        if (current === 'time' && name !== 'time') timeMod.destroy();
        if (current === 'collab' && name !== 'collab') collabMod.destroy();
        fin.hidden = name !== 'finance';
        collabEl.hidden = name !== 'collab';
        timeEl.hidden = name !== 'time';
        if (name === 'time' && current !== 'time') timeMod.render(timeEl);
        if (name === 'collab' && current !== 'collab') collabMod.render(collabEl);
        tabs.forEach(function (t) {
          var on = t.dataset.tab === name;
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
        });
        current = name;
        if (window.WalletTopbar) window.WalletTopbar.setSection(name);
        try { localStorage.setItem('wallet_os_tab', name); } catch (_) {}
        if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
      }

      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { show(t.dataset.tab); });
        t.addEventListener('keydown', function (e) {          // ← → chuyển tab bằng bàn phím
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
          n.focus(); show(n.dataset.tab);
        });
      });
      window.addEventListener('hashchange', function () {
        var h = location.hash.slice(1);
        if (h === 'finance' || h === 'time' || h === 'collab') show(h);
      });

      var start = location.hash.slice(1);
      if (start !== 'finance' && start !== 'time' && start !== 'collab') { try { start = localStorage.getItem('wallet_os_tab'); } catch (_) {} }
      if (start === 'time' || start === 'collab') show(start);
    });
  </script>

      function dismiss() { ov.remove(); }

      var users = [];
      function render() {
        var q = search.value.trim().toLowerCase();
        list.textContent = '';
        var shown = users.filter(function (u) {
          return !q || (u.email || '').toLowerCase().indexOf(q) >= 0 || (u.displayName || '').toLowerCase().indexOf(q) >= 0;

    'use strict';
    var W = window.WalletAdmin;
    if (!W || !W.subscribeAccess) return;

    var I18N = {
      vi: {
        noticeTitle: 'Admin đã truy cập',
        noticeBody: 'Admin đã xem tài khoản của bạn {ago}.',
        liveText: 'Admin đang xem quản lý chi tiêu của bạn',
        close: 'Đóng',
        justNow: 'vừa xong',
        min: '{n} phút trước',
        hour: '{n} giờ trước',
        day: '{n} ngày trước'
      },
      en: {
        noticeTitle: 'Admin accessed your account',
        noticeBody: 'An admin viewed your account {ago}.',
        liveText: 'Admin is viewing your expense tracker',
        close: 'Close',
        justNow: 'just now',
        min: '{n} min ago',
        hour: '{n} hr ago',
        day: '{n} day(s) ago'
      }
    };
    function lang() { return window.app.getLanguage() === 'en' ? 'en' : 'vi'; }
    function t(key, params) {
      var s = (I18N[lang()] || I18N.vi)[key] || key;
      Object.keys(params || {}).forEach(function (k) { s = s.replace('{' + k + '}', params[k]); });
      return s;
    }
    function ago(ms) {
      var m = Math.floor((Date.now() - ms) / 60000);
      if (m < 1) return t('justNow');
      if (m < 60) return t('min', { n: m });
      var h = Math.floor(m / 60);
      if (h < 24) return t('hour', { n: h });
      return t('day', { n: Math.floor(h / 24) });
    }
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    var stack = null;
    function getStack() {
      if (!stack) {
        stack = el('div', 'wa-stack');
        document.body.appendChild(stack);
      }
      return stack;
    }
    function slideIn(node) {
      getStack().appendChild(node);
      requestAnimationFrame(function () { requestAnimationFrame(function () { node.classList.add('is-in'); }); });
    }
    function slideOut(node, after) {
      node.classList.remove('is-in');
      setTimeout(function () { node.remove(); if (after) after(); }, 420);   // dự phòng khi tắt hiệu ứng (Optimize)
    }

    // ---- Thông báo "đã xem lúc ..." (1 lần cho mỗi lượt admin xem) ----
    var noticeEl = null, noticeAt = 0, noticeTimer = null;
    function renderNotice() {
      if (!noticeEl) return;
      noticeEl.querySelector('.wa-notice-title').textContent = t('noticeTitle');
      noticeEl.querySelector('.wa-notice-body').textContent = t('noticeBody', { ago: ago(noticeAt) });
      noticeEl.querySelector('.wa-notice-x').setAttribute('aria-label', t('close'));
    }
    function showNotice(at) {
      if (noticeEl) return;
      noticeAt = at;
      noticeEl = el('div', 'wa-notice');
      noticeEl.setAttribute('role', 'status');
      noticeEl.appendChild(el('span', 'wa-notice-icon', '👁'));
      var txt = el('div', 'wa-notice-text');
      txt.appendChild(el('div', 'wa-notice-title'));
      txt.appendChild(el('div', 'wa-notice-body'));
      noticeEl.appendChild(txt);
      var x = el('button', 'wa-notice-x', '✕'); x.type = 'button';
      noticeEl.appendChild(x);
      function dismiss() {
        clearTimeout(noticeTimer);
        var n = noticeEl; noticeEl = null;
        if (n) slideOut(n);
      }
      x.addEventListener('click', dismiss);
      noticeEl.addEventListener('mouseenter', function () { clearTimeout(noticeTimer); });
      noticeEl.addEventListener('mouseleave', function () { noticeTimer = setTimeout(dismiss, 4000); });
      renderNotice();
      slideIn(noticeEl);
      noticeTimer = setTimeout(dismiss, 9000);
    }

    // ---- Trạng thái "Admin đang xem..." (hiện suốt lúc admin còn xem) ----
    var liveEl = null;
    function renderLive() {
      if (liveEl) liveEl.querySelector('.wa-live-text').textContent = t('liveText');
    }
    function setLive(on) {
      if (on && !liveEl) {
        liveEl = el('div', 'wa-live');
        liveEl.setAttribute('role', 'status');
        liveEl.setAttribute('aria-live', 'polite');
        liveEl.appendChild(el('span', 'wa-live-dot'));
        liveEl.appendChild(el('span', 'wa-live-text'));
        renderLive();
        slideIn(liveEl);
      } else if (!on && liveEl) {
        var n = liveEl; liveEl = null;
        slideOut(n);
      }
    }

    W.subscribeAccess(function (type, detail) {
      if (type === 'live') setLive(detail);
      else if (type === 'notice') showNotice(detail.at);
    });

    // Đổi ngôn ngữ → cập nhật chữ ngay
    window.addEventListener('hubLanguageChanged', function () { renderNotice(); renderLive(); });
  })();
  </script>
</body>
</html>
